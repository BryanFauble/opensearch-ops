# Stub: build & publish the Synapse Portal Search Lab to GitHub Pages, optionally
# re-running the nf-tools search benchmark first (off by default — the deploy doesn't
# need it; the app benchmarks live, in-browser, against whatever the visitor picks).
#
# Queries hit the public Synapse repo-prod API anonymously (no secrets needed).
# To enable: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: benchmark

on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: 'Re-run the nf-tools golden-set benchmark before deploying'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Run benchmark
        # Off by default (see run_benchmark input) — a full golden-set run is dozens of
        # live queries against prod and isn't needed just to deploy the site. Non-fatal:
        # if it does run and fails, the build step below still publishes.
        if: inputs.run_benchmark
        continue-on-error: true
        run: python3 benchmark/run.py tools --label baseline

      - name: Build site
        # Always runs, even if the benchmark step failed. Copies the web/ app and
        # generates site/data/<table>.json (golden cases + boosts + any precomputed
        # baseline from results/) for the interactive Synapse Portal Search Lab.
        run: python3 build_site.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
